<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>와르르 회사</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:#e7dcd5;font-family:'Jua',system-ui,sans-serif;color:#3d3833;user-select:none;-webkit-user-select:none}
  #app,#app canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:3px;will-change:transform}
  .bubble{background:#fff;border-radius:14px;padding:5px 11px;font-size:18px;line-height:1.1;box-shadow:0 2px 0 rgba(0,0,0,.12);position:relative;opacity:0;transform:scale(.6) translateY(6px);transition:opacity .15s,transform .2s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}
  .bubble.on{opacity:1;transform:scale(1) translateY(0)}
  .bubble.loud{font-size:24px;font-weight:700;background:#fff6d4;padding:6px 13px}
  .bubble.loud:after{border-top-color:#fff6d4}
  .name.npc{display:none}
  .seat{display:none !important;position:absolute;left:0;top:0;font-size:11px;color:#6b6157;background:rgba(255,255,255,.75);border-radius:8px;padding:1px 6px;pointer-events:none;white-space:nowrap}
  #banner{top:calc(66px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-8px);background:rgba(61,56,51,.88);color:#fff;border-radius:16px;padding:10px 18px;font-size:17px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;z-index:7}
  #banner.on{opacity:1;transform:translate(-50%,0)}
  #evmenu{top:calc(58px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));background:#fffaf3;border-radius:16px;box-shadow:0 8px 30px rgba(60,40,30,.2);padding:8px;display:none;flex-direction:column;gap:4px;min-width:170px}
  #evmenu.on{display:flex}
  #evmenu b{font-size:12px;color:#a2978b;font-weight:400;padding:4px 8px 2px}
  #evmenu button{border:0;background:none;text-align:left;font-family:inherit;font-size:15px;color:#3d3833;padding:9px 10px;border-radius:10px;cursor:pointer}
  #evmenu button:hover{background:#f3ece3}
  .name.ceo{background:#2f3a52}
  .mg{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(60,45,35,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px}
  .mg.on{display:flex}
  .mg-card{background:#fffaf3;border-radius:24px;padding:16px;width:min(420px,100%);box-shadow:0 14px 50px rgba(60,40,30,.3);animation:pop .2s ease-out}
  .mg-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .mg-head b{font-size:20px;font-weight:400}
  .mg-head button{border:0;background:#f3ece3;border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer;color:#6b6157}
  .mg-sub{font-size:13px;color:#8a8279;margin:0 0 10px}
  .mg canvas{width:100%;display:block;border-radius:16px;touch-action:none;background:#f1e8dd}
  .mg-row{display:flex;gap:8px;margin-top:12px}
  .mg-row button{flex:1;height:52px;border:0;border-radius:16px;font-family:inherit;font-size:18px;cursor:pointer}
  .mg-main{background:#7fb069;color:#fff;box-shadow:0 4px 0 #5b8a48}
  .mg-main:active{transform:translateY(3px);box-shadow:0 1px 0 #5b8a48}
  .mg-sec{background:#f3ece3;color:#3d3833}
  .mg-msg{text-align:center;font-size:18px;min-height:26px;margin-top:10px}
  #cerr{color:#d2553f;font-size:14px;min-height:0;padding:0 20px;text-align:center}
  #cerr:not(:empty){padding:8px 20px 0}
  .bubble:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
  .name{font-size:12px;background:#5b9a4b;color:#fff;border-radius:8px;padding:1px 7px}
  .hud{position:fixed;z-index:5}
  #brand{top:12px;left:12px;background:rgba(255,255,255,.85);border-radius:14px;padding:8px 14px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
  #brand b{font-size:17px;display:block}
  #brand span{font-size:12px;color:#8a8279}
  #tools{top:12px;right:12px;display:flex;gap:6px}
  .btn{border:0;background:rgba(255,255,255,.9);border-radius:12px;font-family:inherit;font-size:15px;color:#3d3833;padding:8px 12px;box-shadow:0 2px 0 rgba(0,0,0,.1);cursor:pointer}
  .btn:active{transform:translateY(1px);box-shadow:none}
  #help{top:64px;left:50%;transform:translateX(-50%);background:rgba(61,56,51,.75);color:#fff;border-radius:12px;padding:7px 14px;font-size:14px;transition:opacity .8s;white-space:nowrap;opacity:0}
  #chat{bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.88);padding:6px;border-radius:16px;box-shadow:0 2px 0 rgba(0,0,0,.1);max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
  #chat::-webkit-scrollbar{display:none}
  #chat .emo{border:0;background:#f3eee8;border-radius:10px;font-family:inherit;font-size:17px;min-width:38px;height:36px;padding:0 8px;cursor:pointer;color:#3d3833;flex:none}
  #chat .emo:active{background:#e6dfd6}
  #chat input{font-family:inherit;font-size:16px;width:96px;height:36px;border:2px solid #e6dfd6;border-radius:10px;padding:0 8px;outline:none;flex:none;color:#3d3833}
  #chat input:focus{border-color:#7fb069}
  #acts{right:calc(14px + env(safe-area-inset-right));bottom:calc(74px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .actb{border:0;border-radius:999px;background:rgba(255,255,255,.96);font-family:inherit;font-size:15px;padding:10px 16px;box-shadow:0 3px 0 rgba(0,0,0,.12);color:#3d3833;display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;animation:pop .18s ease-out}
  .actb.main{background:#7fb069;color:#fff;box-shadow:0 3px 0 #5b8a48;font-size:16px}
  .actb:active{transform:translateY(2px);box-shadow:none}
  .actb small{font-size:11px;opacity:.75;background:rgba(0,0,0,.1);border-radius:6px;padding:1px 6px}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  #joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.7);display:none;pointer-events:none;z-index:6}
  #joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 0 rgba(0,0,0,.15)}
  #marker{position:fixed;width:22px;height:10px;margin:-5px 0 0 -11px;border-radius:50%;border:3px solid #7fb069;pointer-events:none;opacity:0;transition:opacity .3s;z-index:4}
  body.creating .hud,body.creating #tags{display:none}

  /* ---------- 캐릭터 만들기 ---------- */
  #creator{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(70,58,50,.38);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:20px}
  body.creating #creator{display:flex}
  .cr{background:#fffaf3;border-radius:28px;box-shadow:0 18px 60px rgba(60,40,30,.28);display:flex;width:min(920px,100%);height:min(620px,100%);overflow:hidden}
  .stage{flex:0 0 44%;position:relative;background:radial-gradient(120% 90% at 50% 70%,#fffdf8 0,#f6ecdf 60%,#efe2d1 100%);display:flex;flex-direction:column;min-height:0}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
  .stage canvas:active{cursor:grabbing}
  .stage-top{position:relative;display:flex;align-items:center;justify-content:space-between;padding:16px 18px 0;pointer-events:none}
  .stage-top .ttl{font-size:20px}
  .stage-top .ttl small{display:block;font-size:12px;color:#a2978b;margin-top:2px}
  .rot{display:flex;gap:6px;pointer-events:auto}
  .rot button{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.85);box-shadow:0 2px 0 rgba(0,0,0,.08);font-size:16px;color:#6b6157;cursor:pointer;font-family:inherit}
  .stage-bottom{position:relative;margin-top:auto;padding:0 18px 18px;display:flex;justify-content:center}
  .namebox{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:5px 6px 5px 16px;box-shadow:0 3px 0 rgba(0,0,0,.06),0 0 0 2px #efe5d8;width:min(260px,100%)}
  .namebox span{font-size:13px;color:#a2978b;flex:none}
  #nm{flex:1;min-width:0;border:0;outline:none;font-family:inherit;font-size:17px;color:#3d3833;background:transparent;height:34px}
  .namebox:focus-within{box-shadow:0 3px 0 rgba(0,0,0,.06),0 0 0 2px #7fb069}
  .panel{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .tabs{display:flex;gap:4px;padding:14px 16px 0;border-bottom:1px solid #f0e7dc}
  .tab{flex:1;border:0;background:none;font-family:inherit;font-size:15px;color:#a2978b;padding:8px 4px 11px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
  .tab b{font-size:20px;font-weight:400;line-height:1}
  .tab.on{color:#3d3833}
  .tab.on:after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:3px;border-radius:3px;background:#7fb069}
  .tab-body{flex:1;overflow-y:auto;padding:6px 20px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .grp{margin-top:14px}
  .grp h4{margin:0 0 8px;font-size:14px;font-weight:400;color:#8a8279;display:flex;justify-content:space-between}
  .grp h4 em{font-style:normal;color:#5b9a4b}
  .chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
  .chip{border:2px solid #efe5d8;background:#fff;border-radius:14px;min-height:44px;padding:6px 8px;font-family:inherit;font-size:15px;color:#3d3833;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:border-color .15s,background .15s,transform .1s}
  .chip i{font-style:normal;font-size:18px}
  .chip:active{transform:scale(.97)}
  .chip.on{border-color:#7fb069;background:#f0f7ea}
  .sws{display:flex;flex-wrap:wrap;gap:10px}
  .sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #efe5d8;cursor:pointer;padding:0;position:relative;transition:transform .1s}
  .sw:active{transform:scale(.92)}
  .sw.on{box-shadow:0 0 0 3px #7fb069}
  .sw.on:after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.45)}
  .foot{display:flex;gap:10px;padding:12px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid #f0e7dc;background:#fffaf3}
  .foot button{font-family:inherit;font-size:17px;border:0;border-radius:16px;cursor:pointer;height:52px}
  #rnd{background:#f3ece3;color:#3d3833;padding:0 18px;flex:none}
  #enter{flex:1;background:#7fb069;color:#fff;box-shadow:0 4px 0 #5b8a48}
  #enter:active{transform:translateY(3px);box-shadow:0 1px 0 #5b8a48}

  /* 모바일 세로: 위 미리보기 + 아래 옵션, 화면 꽉 채움 */
  @media (max-width:700px) and (orientation:portrait){
    #creator{padding:0}
    .cr{flex-direction:column;width:100%;height:100%;height:100dvh;border-radius:0}
    .stage{flex:0 0 40%;flex:0 0 40dvh;padding-top:env(safe-area-inset-top)}
    .tabs{padding:6px 8px 0}
    .tab-body{padding:4px 16px 12px}
    .chips{grid-template-columns:repeat(3,1fr)}
  }
  /* 모바일 가로: 좌우 배치, 높이 압축 */
  @media (max-height:520px) and (orientation:landscape){
    #creator{padding:0}
    .cr{width:100%;height:100%;height:100dvh;border-radius:0;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
    .stage{flex:0 0 40%}
    .stage-top{padding:10px 12px 0}.stage-top .ttl{font-size:16px}.stage-top .ttl small{display:none}
    .stage-bottom{padding:0 12px 10px}
    .tabs{padding:4px 8px 0}.tab{padding:5px 4px 7px;font-size:13px}.tab b{font-size:16px}
    .tab-body{padding:2px 14px 8px}.grp{margin-top:8px}
    .foot{padding:8px 14px calc(8px + env(safe-area-inset-bottom))}.foot button{height:44px}
  }

  /* 게임 화면 모바일 보정 */
  @media (max-width:700px){
    #brand{padding:6px 11px}#brand b{font-size:15px}#brand span{display:none}
    .btn{padding:8px 10px;font-size:14px}
    #help{white-space:normal;text-align:center;width:max-content;max-width:86vw;font-size:13px}
    }
  #chat{bottom:calc(12px + env(safe-area-inset-bottom))}
  #brand{top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left))}
  #tools{top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right))}
  body{touch-action:manipulation;overscroll-behavior:none}
  #joyHint{position:fixed;left:calc(28px + env(safe-area-inset-left));bottom:calc(84px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;border:2px dashed rgba(255,255,255,.75);background:rgba(255,255,255,.18);display:none;align-items:center;justify-content:center;color:rgba(61,56,51,.55);font-size:12px;pointer-events:none;z-index:3;text-align:center;line-height:1.2}
  body.touch.inoffice #joyHint{display:flex}
  body.touch.joying #joyHint{display:none}
  @media (pointer:coarse){
    #bZoomOut,#bZoomIn{display:none}
    .bubble{font-size:15px;padding:4px 9px}
    .bubble.loud{font-size:19px}
    .name{font-size:11px}
    #banner{white-space:normal;text-align:center;font-size:15px;width:max-content;max-width:88vw}
    #acts{gap:6px}
    .actb{min-height:42px;font-size:14px;padding:8px 13px}
    .actb.main{font-size:15px}
  }
  @media (pointer:coarse) and (max-height:500px){
    #brand span{display:none}
    #acts{bottom:calc(64px + env(safe-area-inset-bottom));flex-direction:row-reverse;align-items:flex-end;max-width:60vw;flex-wrap:wrap-reverse}
    .actb{min-height:38px;font-size:13px;padding:6px 11px}
    #chat{bottom:calc(8px + env(safe-area-inset-bottom));padding:4px}
    #chat .emo{height:32px;min-width:34px;font-size:15px}
    #chat input{height:32px}
    #joyHint{bottom:calc(60px + env(safe-area-inset-bottom));width:80px;height:80px}
    #help{top:calc(52px + env(safe-area-inset-top))}
  }
</style>

</script>

<body class="creating">
<div id="app"></div>
<div id="tags"></div>
<div id="marker"></div>
<div id="joy"><i></i></div>
<div id="joyHint">여기를<br>끌어서 이동</div>

<div id="brand" class="hud"><b>🧱 와르르 회사</b><span id="online">사무실 · 혼자 보기</span></div>
<div id="tools" class="hud">
  <button class="btn" id="bEv" aria-label="이벤트 미리보기">🎬</button>
  <button class="btn" id="bEdit">꾸미기</button>
  <button class="btn" id="bZoomOut">－</button>
  <button class="btn" id="bZoomIn">＋</button>
</div>
<div id="banner" class="hud"></div>
<div id="evmenu" class="hud"><b>이벤트 미리보기</b><button data-a="ceo">🚨 대표님 순찰</button><button data-a="lunch">🍚 점심시간</button><button data-a="off">🎉 퇴근 (5시)</button><button data-a="work">☀️ 다시 출근</button><button data-a="wx">🌦️ 창밖 날씨 바꾸기</button><button data-a="real">⏰ 실제 시간으로</button></div>
<div id="help" class="hud">방향키·WASD로 이동 · 바닥 클릭/터치로 이동 · E 상호작용</div>
<div id="chat" class="hud">
  <button class="emo" data-say="👍" aria-label="따봉">👍</button>
  <button class="emo" data-say="👎" aria-label="낫따봉">👎</button>
  <button class="emo" data-say="ㅋㅋㅋ">ㅋㅋㅋ</button>
  <input id="say" maxlength="5" placeholder="5자까지" autocomplete="off" enterkeyhint="send">
</div>
<div id="acts" class="hud"></div>
<div id="mg" class="mg"><div class="mg-card"><div class="mg-head"><b id="mgTitle"></b><button id="mgX" aria-label="닫기">✕</button></div><p class="mg-sub" id="mgSub"></p><canvas id="mgCv" width="400" height="280"></canvas><div class="mg-msg" id="mgMsg"></div><div class="mg-row" id="mgRow"></div></div></div>

<div id="creator">
  <div class="cr">
    <section class="stage">
      <canvas id="pv"></canvas>
      <div class="stage-top">
        <div class="ttl" id="cTitle">출근 준비<small>5층 들어가기 전에 나를 꾸며요</small></div>
        <div class="rot"><button id="rotL" aria-label="왼쪽으로 돌리기">↺</button><button id="rotR" aria-label="오른쪽으로 돌리기">↻</button></div>
      </div>
      <div class="stage-bottom">
        <label class="namebox"><span>이름</span><input id="nm" maxlength="6" placeholder="자리 번호 또는 별명" autocomplete="off" enterkeyhint="done"></label>
      </div>
    </section>
    <section class="panel">
      <nav class="tabs" id="tabs"></nav>
      <div class="tab-body" id="tabBody"></div>
      <div id="cerr"></div>
      <div class="foot">
        <button id="rnd">🎲 랜덤</button>
        <button id="enter">입장하기</button>
      </div>
    </section>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/*
  와르르 회사 — 3D 사무실.
  좌표: 시안 이미지 픽셀(u, v)을 그대로 쓰고 월드로 바꿀 때 X = u/88, Z = v/73.
  카메라는 시안과 같은 56° 내려다보는 정사영이라 화면 배치가 시안과 맞는다.
*/
const PX = 88, PZ = 73;
const X = u => u / PX, Z = v => v / PZ;
const TILT = 56 * Math.PI / 180;

/* ---------- 렌더러 · 조명 ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
const COARSE = matchMedia('(pointer:coarse)').matches;
const MAX_DPR = COARSE ? 1.25 : 1.75;
renderer.setPixelRatio(Math.min(MAX_DPR, window.devicePixelRatio || 1));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = !matchMedia('(pointer:coarse)').matches;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.shadowMap.needsUpdate = true;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#e7dcd5');
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;
scene.environmentIntensity = 0.35;

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
const hemi = new THREE.HemisphereLight('#fff3e4', '#a49a8f', 0.62);
scene.add(hemi);
const MOBILE = matchMedia('(pointer:coarse)').matches;
const SUN_K = MOBILE ? 0.62 : 1;
const sun = new THREE.DirectionalLight('#ffe9cc', 1.25 * SUN_K);
sun.castShadow = true;
sun.shadow.mapSize.set(matchMedia('(pointer:coarse)').matches ? 1024 : 2048, matchMedia('(pointer:coarse)').matches ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 10, bottom: -10, near: 1, far: 60 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.025; sun.shadow.radius = 3;

}

  { name: '진한 아메리카노', steps: [['에스프레소', '#5a3a22'], ['물', '#c8e3ef']] },

function openCoffeeGame() {

  const rest = 0.88 - targets.reduce((a, b) => a + b, 0), zeros = targets.filter(t => !t).length;
  for (let i = 0; i < n; i++) { if (!targets[i]) targets[i] = rest / zeros; acc += targets[i]; targets[i] = acc; }
  mgShow('☕ 커피 타기', `주문: ${menu.name} — 꾹 눌러 붓고, 점선에 맞춰 손을 떼요!`);
  const W = mgCv.width, H = mgCv.height;
  let stage = 0, fill = 0, pouring = false, state = 'play', last = performance.now(), errs = [], drip = [];
  const layers = []; // [from, to, color]
  const best = +(store('wrr-coffee-best') || 0);
  const start = () => { if (state !== 'play') return; pouring = true; };
  const stop = () => {
    if (!pouring || state !== 'play') return; pouring = false;
    const prev = stage ? targets[stage - 1] : 0;
    layers.push([layers.length ? layers[layers.length - 1][1] : 0, fill, menu.steps[stage][1]]);
    errs.push(Math.abs(fill - targets[stage]));
    const e = errs[errs.length - 1];
    mgMsg.textContent = e < 0.02 ? '딱 맞아요!' : e < 0.05 ? '괜찮아요' : fill > targets[stage] ? '너무 많이 부었어요' : '조금 모자라요';
    beep(e < 0.03 ? [880] : [440], 0.05, 'sine', 0.035);

    state = 'done';

    const grade = score >= 90 ? '바리스타 ☕✨' : score >= 70 ? '맛있어요 😋' : score >= 40 ? '애매한 맛 🤔' : '이건 좀… 😵';
    store('wrr-coffee-best', Math.max(best, score));
    mgMsg.textContent = `${grade}  ${score}점${score > best ? ' · 최고 기록!' : ` · 최고 ${best}점`}`;
    mgButtons([['다시 하기', 'mg-sec', () => { mgClose(); openCoffeeGame(); }], ['들고 가기', 'mg-main', () => { mgClose(); brewCoffee(me); me.say(score >= 70 ? '맛있다!' : '음…'); }]]);
  };
  mgRow.innerHTML = '';
  const pb = document.createElement('button'); pb.className = 'mg-main'; pb.textContent = '꾹 눌러서 붓기'; mgRow.appendChild(pb);

  mgKey = e => { if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); if (e.type === 'keydown' && !e.repeat) start(); } };
  const keyUp = e => { if (e.code === 'Space' || e.key === ' ') stop(); };
  addEventListener('keydown', mgKey); addEventListener('keyup', keyUp);
  mgExtraOff = () => removeEventListener('keyup', keyUp);
  const draw = now => {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (pouring && state === 'play') { fill = Math.min(1, fill + dt * (menu.steps[stage][0] === '바닐라 시럽' ? 0.18 : 0.3)); if (fill >= 1) stop(); if (Math.random() < 0.6) drip.push({ y: 40, x: W / 2 + (Math.random() - 0.5) * 6 }); }
    const g = mgCtx; g.clearRect(0, 0, W, H);
    g.fillStyle = '#efe5d6'; g.fillRect(0, 0, W, H);
    // 머신 노즐

    g.fillStyle = '#2a2725'; rr(g, W / 2 - 10, 26, 20, 14, 4); g.fill();
    // 컵

    targets.forEach((t, i) => {
      const y = yAt(t); g.setLineDash([6, 5]); g.strokeStyle = i === stage && state === 'play' ? '#d2553f' : 'rgba(61,56,51,.35)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(cx - halfAt(y) - 14, y); g.lineTo(cx + halfAt(y) + 14, y); g.stroke(); g.setLineDash([]);
      g.fillStyle = i === stage && state === 'play' ? '#d2553f' : 'rgba(61,56,51,.5)'; g.font = '13px Jua, sans-serif'; g.textAlign = 'left'; g.fillText(menu.steps[i][0], cx + halfAt(y) + 18, y + 4);

    g.fillStyle = '#3d3833'; g.font = '16px Jua, sans-serif'; g.textAlign = 'left';
    g.fillText(state === 'play' && stage < n ? `지금: ${menu.steps[stage][0]}` : '완성!', 14, 26);
    if (mgOpen) mgLoop = requestAnimationFrame(draw);
  };
  mgLoop = requestAnimationFrame(draw);
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitP = new THREE.Vector3();
const marker = document.getElementById('marker');
function tapAt(cx, cy) {
  if (me.riding) stopRide();
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  let target = null;
  const hits = ray.intersectObjects(pickables, true);
  for (const h of hits) {
    let o = h.object; while (o && !o.userData.it) o = o.parent;
    if (o) { target = o.userData.it; break; }
    if (h.object.isMesh && h.object.material && !h.object.material.transparent) break;
  }
  let ok;
  if (target && target.kind === 'npc') { const c = target.npc.char; target.sx = c.x + 0.45; target.sz = c.z + 0.3; }
  if (target) {
    if (Math.hypot(me.x - target.sx, me.z - target.sz) < target.r) { doAction(target, me); ok = true; }
    else ok = me.goTo(target.sx, target.sz, target);
  } else {
    if (!ray.ray.intersectPlane(floorPlane, hitP)) return;
    ok = me.goTo(hitP.x, hitP.z);
  }
  if (ok) { marker.style.left = cx + 'px'; marker.style.top = cy + 'px'; marker.style.opacity = 1; setTimeout(() => marker.style.opacity = 0, 450); }
}
const actsEl = document.getElementById('acts');
let curActs = [];
function doInteract(i) {
  if (me.sitting && i === 0 && !curActs.length) { me.standUp(); return; }
  const it = curActs[i]; if (it) doAction(it, me);
  else if (me.sitting) me.standUp();
}
function renderActs() {
  curActs = entered && !creating() ? (me.riding ? [UNRIDE] : nearbyActions(me)) : [];
  const labels = curActs.map(labelOf);
  if (me.sitting && !me.riding) labels.push('일어나기');
  const key = labels.join('|');
  if (actsEl.dataset.k === key) return;
  actsEl.dataset.k = key; actsEl.innerHTML = '';
  labels.forEach((l, i) => {
    const b = document.createElement('button'); b.className = 'actb' + (i === 0 ? ' main' : '');
    const kbd = i < curActs.length ? (i === 0 ? 'E' : String(i + 1)) : '';
    b.innerHTML = `${l}${kbd ? `<small>${kbd}</small>` : ''}`;
    b.onclick = () => { if (i < curActs.length) doAction(curActs[i], me); else me.standUp(); };
    actsEl.appendChild(b);
  });
}
document.querySelectorAll('#chat .emo').forEach(b => b.addEventListener('click', () => { me.say(b.dataset.say); beep([620], 0.05); }));
let zoom = 1;
document.getElementById('bZoomIn').onclick = () => zoom = Math.min(2.2, zoom * 1.2);
document.getElementById('bZoomOut').onclick = () => zoom = Math.max(0.45, zoom / 1.2);
addEventListener('wheel', e => { if (entered && !creating()) zoom = Math.min(2.2, Math.max(0.45, zoom * (e.deltaY > 0 ? 0.92 : 1.08))); }, { passive: true });

/* ---------- 카메라 (시안과 같은 56° 정사영) ---------- */
const cam = { x: me.x, z: me.z };
const VIEW_DIR = new THREE.Vector3(0, Math.sin(TILT), Math.cos(TILT));
const B = { x1: X(140), x2: X(1560), z1: Z(70), z2: Z(920) };
function placeCamera(dt) {
  const k = Math.min(1, dt * 5);
  cam.x += (me.x - cam.x) * k; cam.z += (me.z - 0.35 - cam.z) * k;
  const base = innerWidth < innerHeight ? innerWidth / 470 : Math.min(innerHeight / 620, innerWidth / 900);
  const ppu = PX * Math.max(0.5, base) * zoom;             // 화면 px / 월드 1
  const hw = innerWidth / ppu / 2, hh = innerHeight / ppu / 2;
  const hz = hh / Math.sin(TILT);                          // 바닥 기준 세로 반폭
  const W = B.x2 - B.x1, D = B.z2 - B.z1;
  const cx = hw * 2 >= W ? (B.x1 + B.x2) / 2 : Math.min(B.x2 - hw, Math.max(B.x1 + hw, cam.x));
  const cz = hz * 2 >= D ? (B.z1 + B.z2) / 2 : Math.min(B.z2 - hz, Math.max(B.z1 + hz, cam.z));
  camera.left = -hw; camera.right = hw; camera.top = hh; camera.bottom = -hh;
  camera.position.set(cx, 0, cz).addScaledVector(VIEW_DIR, 60);
  camera.lookAt(cx, 0, cz);
  camera.updateProjectionMatrix();
}

/* ---------- 루프 ---------- */
let last = performance.now(), T = 0;
function updatePlayer(dt) {
  if (!entered || creating()) return;
  let dx = 0, dz = 0;
  if (keys.has('arrowleft') || keys.has('a')) dx -= 1;
  if (keys.has('arrowright') || keys.has('d')) dx += 1;
  if (keys.has('arrowup') || keys.has('w')) dz -= 1;
  if (keys.has('arrowdown') || keys.has('s')) dz += 1;
  dx += joyV[0]; dz += joyV[1];
  if (mgOpen) return;
  if (me.riding) { updateRide(dx, dz, dt); return; }
  const l = Math.hypot(dx, dz);
  if (l > 0.15) {
    if (me.sitting) me.standUp();
    me.path = []; me.pending = null;
    const k = Math.min(1, l) / l;
    const ax = Math.abs(dx) > Math.abs(dz) * 2.2 ? 1 : Math.abs(dz) > Math.abs(dx) * 2.2 ? 2 : 0;
    me.tryMove(ax === 2 ? 0 : dx * k * me.speed * dt, ax === 1 ? 0 : dz * k * me.speed * dt, true);
    me.face = Math.atan2(dx, dz); me.moving = true;
  } else me.followPath(dt);
}
function loop(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; T += dt;
  updatePlayer(dt);
  updateEvents(dt);
  npcs.forEach(n => runNpc(n, dt));
  updateRemotes(dt);
  parcelTimer -= dt; if (parcelTimer <= 0) { parcelTimer = 60 + Math.random() * 50; if (parcelN < 4) setParcels(parcelN + 1); }
  snackTimer -= dt; if (snackTimer <= 0) { snackTimer = 150; if (snackN < 2) setSnacks(4); }
  chars.forEach(c => c.update(dt, T));
  updateTweens(dt);
  updateDoors(dt);
  updateElev(dt);
  updateClock();
  shadowClock -= dt;
  if (shadowNow || ((shadowDirty || tweens.length) && shadowClock <= 0)) { renderer.shadowMap.needsUpdate = true; shadowDirty = false; shadowNow = false; shadowClock = 1.5; }
  placeCamera(dt);
  renderActs();
  renderer.render(scene, camera);
  for (const c of chars) {
    tmpV.set(c.x, 1.3 + c.m.body.position.y, c.z).project(camera);
    const x = (tmpV.x * 0.5 + 0.5) * innerWidth, y = (-tmpV.y * 0.5 + 0.5) * innerHeight;
    c.tag.style.transform = `translate(${x}px,${y}px) translate(-50%,-100%)`;
    c.tag.style.visibility = c.anchor.visible ? 'visible' : 'hidden';
  }
  for (const { c, el } of seatTags) {
    if (c.occupant) { el.style.display = 'none'; continue; }
    tmpV.set(c.x, 1.05, c.z).project(camera); el.style.display = '';
    el.style.transform = `translate(${(tmpV.x * 0.5 + 0.5) * innerWidth}px,${(-tmpV.y * 0.5 + 0.5) * innerHeight}px) translate(-50%,-100%)`;
  }
  sendPresence();
  if (creating()) updatePreview(dt);
  requestAnimationFrame(loop);
}
addEventListener('resize', () => renderer.setSize(innerWidth, innerHeight));
openCreator();
requestAnimationFrame(loop);
window.__game = { startPatrol: () => startPatrol(), setForced: (f) => { forced = f; forcedT = 600; }, get phase() { return phase; }, duck, startRide: c => startRide(c), stopRide: () => stopRide(), setWeather: w => setWeather(w), sim: sec => { for (let t = 0; t < sec; t += 0.05) { T += 0.05; updateEvents(0.05); npcs.forEach(n => runNpc(n, 0.05)); chars.forEach(c => c.update(0.05, T)); updateTweens(0.05); updateDoors(0.05); } }, npcs, heaters, setParcels, me, chars, interactables, findPath, collides, chairs, doors, enterOffice: () => enterOffice(), setOpt: (k, v) => setOpt(k, v), get look() { return look; }, X, Z, tapAt };
</script>
